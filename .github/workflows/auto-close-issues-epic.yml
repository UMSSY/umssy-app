name: Auto-close Linked Issues on Epic Merges
on:
  pull_request:
    types: [closed]
    branches:
      - 'epic/*'

permissions:
  issues: write
  pull-requests: read

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Get linked issues via GraphQL and close them
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const query = `
              query($owner:String!, $name:String!, $prNumber:Int!) {
                repository(owner:$owner, name:$name) {
                  pullRequest(number:$prNumber) {
                    closingIssuesReferences(first: 10) {
                      nodes {
                        number
                      }
                    }
                  }
                }
              }
            `;
            
            const variables = {
              owner: context.repo.owner,
              name: context.repo.repo,
              prNumber: context.issue.number
            };
            
            const result = await github.graphql(query, variables);
            const linkedIssues = result.repository.pullRequest.closingIssuesReferences.nodes;
            
            if (linkedIssues.length === 0) {
              console.log("No issues formally linked to this PR were found.");
              return;
            }
            
            for (const issue of linkedIssues) {
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
                console.log(`Issue #${issue.number} closed automatically.`);
              } catch (error) {
                console.error(`Error closing issue #${issue.number}:`, error.message);
              }
            }