name: CI Database

on:
  pull_request:
    branches: [develop, main, "epic/**"]
    paths:
      - "backend/prisma/**"
      - "backend/prisma7.config.ts"
      - "backend/tsconfig.seed.json"
      - "backend/src/common/database/**"
      - "backend/src/modules/**/seeds/**"
      - "backend/src/modules/**/constants/seed-*.ts"
      - ".github/workflows/ci-database.yml"

jobs:
  migrations-and-seeds:
    name: Migrations and seeds on a temporary database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password_db
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_USER: user
      DB_PASSWORD: password_db
      DB_NAME: app_db
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_SCHEMA: public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm generate

      - name: Apply all migrations on an empty database
        run: pnpm exec prisma migrate deploy

      - name: Run seeds (first run)
        run: pnpm seed:run

      - name: Run seeds again (idempotency check)
        run: pnpm seed:run
