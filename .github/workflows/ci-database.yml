name: CI Database

on:
  pull_request:
    branches: [develop, main, "epic/**"]
    paths:
      - "backend/prisma/**"
      - "backend/prisma*.config.ts"
      - "backend/**/*seed*"
      - "backend/**/seeds/**"
      - "backend/src/common/database/**"
      - "backend/src/common/prisma/**"
      - "backend/package.json"
      - "backend/pnpm-lock.yaml"
      - "backend/pnpm-workspace.yaml"
      - "backend/tsconfig*.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-database.yml"

permissions:
  contents: read

jobs:
  migrations-and-seeds:
    name: Validate migrations and seeds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./backend
    env:
      NODE_ENV: development
      HUSKY: "0"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      DB_NAME: umssy_ci
      DB_SCHEMA: public
      SEED_TRANSACTION_TIMEOUT_MS: "120000"

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: umssy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d umssy_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm exec prisma validate --config prisma7.config.ts

      - name: Apply all migrations to the empty database
        run: pnpm exec prisma migrate deploy --config prisma7.config.ts

      - name: Verify migrations match the Prisma schema
        run: >-
          pnpm exec prisma migrate diff
          --config prisma7.config.ts
          --from-config-datasource
          --to-schema prisma/schema.prisma
          --exit-code

      - name: Generate Prisma client
        run: pnpm generate

      - name: Validate production catalogs and administrator seeds
        env:
          NODE_ENV: production
        run: |
          pnpm run seed:production
          pnpm run seed:admin --email ci-admin@example.test

      - name: Validate development seeds and fixtures
        run: pnpm run seed:run
