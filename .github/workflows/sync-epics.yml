name: Sync Develop to Epics

on:
  push:
    branches:
      - develop

jobs:
  sync-epics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN}}

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Identify merged pull request
        id: merged-pr
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequests = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { ...context.repo, commit_sha: context.sha, per_page: 100 }
            );
            const merged = pullRequests
              .filter(pr => pr.merged_at && pr.base.ref === 'develop')
              .sort((a, b) => Date.parse(b.merged_at) - Date.parse(a.merged_at));
            const pr = merged.find(pr => pr.merge_commit_sha === context.sha) ?? merged[0];
            core.setOutput('source', pr
              ? `${pr.head.repo?.owner.login ?? pr.head.user.login}/${pr.head.ref} (PR #${pr.number}: ${pr.title})`
              : `direct push to develop (${context.sha})`);

      - name: Sync develop to all epic/* branches
        env:
          MERGED_SOURCE: ${{ steps.merged-pr.outputs.source }}
        run: |
          git fetch origin

          EPIC_BRANCHES=$(git branch -r | grep -E 'origin/epic/' | sed 's/origin\///')

          if [ -z "$EPIC_BRANCHES" ]; then
            echo "No remote branches found matching the pattern 'epic/*'."
            exit 0
          fi

          FAILED_BRANCHES=()

          for branch in $EPIC_BRANCHES; do

            git checkout -B "$branch" "origin/$branch"


            if git merge origin/develop --no-ff -m "chore: auto-sync develop into $branch"; then
              if git push origin "$branch"; then
                echo "Successfully synced $branch."
              else
                echo "Error pushing to $branch."
                FAILED_BRANCHES+=("$branch (Push error)")
                git reset --hard "origin/$branch"
              fi
            else
              echo "Git conflict detected in $branch. Aborting merge..."
              git merge --abort
              FAILED_BRANCHES+=("$branch (Merge conflicts)")
            fi
          done

          if [ ${#FAILED_BRANCHES[@]} -ne 0 ]; then
            echo "The following branches could not be synced automatically after $MERGED_SOURCE was integrated into develop:"
            for failed in "${FAILED_BRANCHES[@]}"; do
              echo " - $failed"
            done
            exit 1
          fi
