<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · UMSSY</title>
    <link rel="icon" href="/icons/icon-umssy.svg" />
    <style>
      :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7f9; color: #0b1f2e; }
      main { max-width: 26rem; margin: 1rem; padding: 2rem 1.5rem; border-radius: 1rem; background: #fff; text-align: center; box-shadow: 0 1px 3px rgba(11, 31, 46, 0.12); }
      img { width: 3.5rem; height: 3.5rem; }
      h1 { margin: 1rem 0 0.5rem; font-size: 1.25rem; }
      p { margin: 0 0 1.5rem; line-height: 1.5; color: #4a5865; }
      .actions { display: flex; flex-direction: column; gap: 0.75rem; }
      a { display: block; padding: 0.75rem 1rem; border-radius: 0.5rem; background: #0b1f2e; color: #fff; text-decoration: none; font-weight: 600; }
      a.secondary { background: transparent; color: #0b1f2e; border: 1px solid #c9d1d9; }
      @media (prefers-color-scheme: dark) {
        body { background: #0b141b; color: #e6edf3; }
        main { background: #111c25; box-shadow: none; }
        p { color: #9fb0bf; }
        a { background: #e6edf3; color: #0b1f2e; }
        a.secondary { background: transparent; color: #e6edf3; border-color: #2d3b47; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-umssy.svg" alt="" />
      <h1>Estás sin conexión</h1>
      <p>Esta página necesita conexión a Internet. Tus pases guardados siguen disponibles en Mis inscripciones.</p>
      <div class="actions">
        <a href="/events/my-passes">Ir a Mis inscripciones</a>
        <a class="secondary" href="" onclick="location.reload(); return false;">Reintentar</a>
      </div>
    </main>
  </body>
</html>
