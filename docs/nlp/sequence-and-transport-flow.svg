<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1420" width="1520" height="1420" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Participant Gradients -->
    <linearGradient id="pClient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="pEvents" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="pService" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="pSources" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="pDetection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="pValidation" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db2777"/><stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="pRecon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/><stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="pDB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-db" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-event" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#c084fc"/>
    </marker>

    <!-- Shadow filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title Header Banner -->
  <rect x="30" y="20" width="1460" height="64" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="58" cy="52" r="10" fill="#38bdf8"/>
  <text x="80" y="58" fill="#f9fafb" font-size="20" font-weight="700" letter-spacing="0.3">Sequence and Transport Flow · Epic #2 NLP Module</text>
  <rect x="1270" y="38" width="200" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="1370" y="56" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600">UMSSY ARCHITECTURE</text>

  <!-- Lifelines -->
  <line x1="100" y1="150" x2="100" y2="1320" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="290" y1="150" x2="290" y2="1320" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="490" y1="150" x2="490" y2="1320" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="690" y1="150" x2="690" y2="1320" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="890" y1="150" x2="890" y2="1320" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="1080" y1="150" x2="1080" y2="1320" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="1270" y1="150" x2="1270" y2="1320" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="1440" y1="150" x2="1440" y2="1320" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Top Participant Cards -->
  <!-- Client -->
  <g filter="url(#cardShadow)">
    <rect x="25" y="105" width="150" height="46" rx="8" fill="url(#pClient)"/>
    <text x="100" y="125" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Client</text>
    <text x="100" y="141" text-anchor="middle" fill="#dbeafe" font-size="10">Frontend / Profile</text>
  </g>
  <!-- Events -->
  <g filter="url(#cardShadow)">
    <rect x="215" y="105" width="150" height="46" rx="8" fill="url(#pEvents)"/>
    <text x="290" y="125" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Events</text>
    <text x="290" y="141" text-anchor="middle" fill="#ede9fe" font-size="10">ProfileSkillsEvents</text>
  </g>
  <!-- Service -->
  <g filter="url(#cardShadow)">
    <rect x="415" y="105" width="150" height="46" rx="8" fill="url(#pService)"/>
    <text x="490" y="125" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Service</text>
    <text x="490" y="141" text-anchor="middle" fill="#e0f2fe" font-size="10">SkillsAnalysisService</text>
  </g>
  <!-- Sources -->
  <g filter="url(#cardShadow)">
    <rect x="615" y="105" width="150" height="46" rx="8" fill="url(#pSources)"/>
    <text x="690" y="125" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Sources</text>
    <text x="690" y="141" text-anchor="middle" fill="#d1fae5" font-size="10">SkillSourcesService</text>
  </g>
  <!-- Detection -->
  <g filter="url(#cardShadow)">
    <rect x="815" y="105" width="150" height="46" rx="8" fill="url(#pDetection)"/>
    <text x="890" y="125" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Detection</text>
    <text x="890" y="141" text-anchor="middle" fill="#fef3c7" font-size="10">SkillDetectionService</text>
  </g>
  <!-- Validation -->
  <g filter="url(#cardShadow)">
    <rect x="1005" y="105" width="150" height="46" rx="8" fill="url(#pValidation)"/>
    <text x="1080" y="125" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Validation</text>
    <text x="1080" y="141" text-anchor="middle" fill="#fce7f3" font-size="10">SkillValidationService</text>
  </g>
  <!-- Recon -->
  <g filter="url(#cardShadow)">
    <rect x="1195" y="105" width="150" height="46" rx="8" fill="url(#pRecon)"/>
    <text x="1270" y="125" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Recon</text>
    <text x="1270" y="141" text-anchor="middle" fill="#e0e7ff" font-size="10">SkillAnalysisService</text>
  </g>
  <!-- DB -->
  <g filter="url(#cardShadow)">
    <rect x="1365" y="105" width="145" height="46" rx="8" fill="url(#pDB)"/>
    <text x="1437" y="125" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">DB</text>
    <text x="1437" y="141" text-anchor="middle" fill="#ccfbf1" font-size="10">PostgreSQL (Prisma)</text>
  </g>

  <!-- STEP 1: Client -> Events -->
  <g>
    <circle cx="100" cy="185" r="10" fill="#3b82f6"/>
    <text x="100" y="189" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">1</text>
    <line x1="110" y1="185" x2="280" y2="185" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-solid)"/>
    <text x="195" y="177" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">sourceChanged(userId)</text>
  </g>

  <!-- STEP 2: Events -> Service -->
  <g>
    <circle cx="290" cy="245" r="10" fill="#8b5cf6"/>
    <text x="290" y="249" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">2</text>
    <line x1="300" y1="245" x2="480" y2="245" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-event)"/>
    <text x="390" y="237" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">refreshAfterChange(userId)</text>
  </g>

  <!-- STEP 3: Service -> DB -->
  <g>
    <circle cx="490" cy="305" r="10" fill="#0284c7"/>
    <text x="490" y="309" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">3</text>
    <line x1="500" y1="305" x2="1430" y2="305" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-db)"/>
    <text x="965" y="297" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="600">registerSourceChange() [input_revision++]</text>
  </g>

  <!-- STEP 4: Service -> Sources -->
  <g>
    <circle cx="490" cy="365" r="10" fill="#0284c7"/>
    <text x="490" y="369" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">4</text>
    <line x1="500" y1="365" x2="680" y2="365" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-solid)"/>
    <text x="590" y="357" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">findTextSources(userId) + findCatalog()</text>
  </g>

  <!-- STEP 5: Sources -> DB -->
  <g>
    <circle cx="690" cy="425" r="10" fill="#059669"/>
    <text x="690" y="429" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">5</text>
    <line x1="700" y1="425" x2="1430" y2="425" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-db)"/>
    <text x="1065" y="417" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="600">Read profile, work experiences, education, certificates, CV</text>
  </g>

  <!-- STEP 6: Sources -> Service (Return) -->
  <g>
    <circle cx="690" cy="485" r="10" fill="#059669"/>
    <text x="690" y="489" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">6</text>
    <line x1="680" y1="485" x2="500" y2="485" stroke="#34d399" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-return)"/>
    <text x="590" y="477" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="600">Aggregated text sources</text>
  </g>

  <!-- STEP 7: Service -> Validation -->
  <g>
    <circle cx="490" cy="545" r="10" fill="#0284c7"/>
    <text x="490" y="549" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">7</text>
    <line x1="500" y1="545" x2="1070" y2="545" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-solid)"/>
    <text x="785" y="537" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">validateSources(sources)</text>
  </g>

  <!-- STEP 8: Validation -> Service (Return) -->
  <g>
    <circle cx="1080" cy="605" r="10" fill="#db2777"/>
    <text x="1080" y="609" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">8</text>
    <line x1="1070" y1="605" x2="500" y2="605" stroke="#34d399" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-return)"/>
    <text x="785" y="597" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="600">Accepted sources (&lt; 20,000 characters)</text>
  </g>

  <!-- STEP 9: Service -> Detection -->
  <g>
    <circle cx="490" cy="665" r="10" fill="#0284c7"/>
    <text x="490" y="669" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">9</text>
    <line x1="500" y1="665" x2="880" y2="665" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-solid)"/>
    <text x="690" y="657" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">detect(sources, catalog)</text>
  </g>

  <!-- NOTE OVER DETECTION -->
  <g filter="url(#cardShadow)">
    <rect x="730" y="700" width="320" height="52" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="890" y="721" text-anchor="middle" fill="#fef08a" font-size="11" font-weight="700">Heuristic Engine Pipeline</text>
    <text x="890" y="739" text-anchor="middle" fill="#94a3b8" font-size="10">Tokenization · Stopwords · Longest Match · Negations · Context</text>
  </g>

  <!-- STEP 10: Detection -> Service (Return) -->
  <g>
    <circle cx="890" cy="785" r="10" fill="#d97706"/>
    <text x="890" y="789" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">10</text>
    <line x1="880" y1="785" x2="500" y2="785" stroke="#34d399" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-return)"/>
    <text x="690" y="777" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="600">Detected candidates with evidence references</text>
  </g>

  <!-- STEP 11: Service -> Validation -->
  <g>
    <circle cx="490" cy="845" r="10" fill="#0284c7"/>
    <text x="490" y="849" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">11</text>
    <line x1="500" y1="845" x2="1070" y2="845" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-solid)"/>
    <text x="785" y="837" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">validateDetected(candidates, catalog)</text>
  </g>

  <!-- STEP 12: Validation -> Service (Return) -->
  <g>
    <circle cx="1080" cy="905" r="10" fill="#db2777"/>
    <text x="1080" y="909" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">12</text>
    <line x1="1070" y1="905" x2="500" y2="905" stroke="#34d399" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-return)"/>
    <text x="785" y="897" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="600">Validated skills against catalog</text>
  </g>

  <!-- STEP 13: Service -> DB (Start TX) -->
  <g>
    <circle cx="490" cy="965" r="10" fill="#0284c7"/>
    <text x="490" y="969" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">13</text>
    <line x1="500" y1="965" x2="1430" y2="965" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-db)"/>
    <text x="965" y="957" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="600">Start isolated transaction ($transaction)</text>
  </g>

  <!-- STEP 14: Service -> Recon -->
  <g>
    <circle cx="490" cy="1025" r="10" fill="#0284c7"/>
    <text x="490" y="1029" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">14</text>
    <line x1="500" y1="1025" x2="1260" y2="1025" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-solid)"/>
    <text x="880" y="1017" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">reconcileDetected(userId, accepted, context)</text>
  </g>

  <!-- STEP 15: Recon -> DB -->
  <g>
    <circle cx="1270" cy="1085" r="10" fill="#4f46e5"/>
    <text x="1270" y="1089" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">15</text>
    <line x1="1280" y1="1085" x2="1430" y2="1085" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-db)"/>
    <text x="1355" y="1077" text-anchor="middle" fill="#fde68a" font-size="10" font-weight="600">planSkillReconciliation() -> INSERT/UPDATE/DELETE user_skills</text>
  </g>

  <!-- STEP 16: Service -> DB -->
  <g>
    <circle cx="490" cy="1145" r="10" fill="#0284c7"/>
    <text x="490" y="1149" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">16</text>
    <line x1="500" y1="1145" x2="1430" y2="1145" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-db)"/>
    <text x="965" y="1137" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="600">Update profile_skill_processing_states (ready, processedRevision, resultVersion++)</text>
  </g>

  <!-- STEP 17: Service -> Events -->
  <g>
    <circle cx="490" cy="1205" r="10" fill="#0284c7"/>
    <text x="490" y="1209" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">17</text>
    <line x1="480" y1="1205" x2="300" y2="1205" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-event)"/>
    <text x="390" y="1197" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">published(userId, inputRevision, resultVersion)</text>
  </g>

  <!-- Bottom Participant Cards -->
  <!-- Client -->
  <g filter="url(#cardShadow)">
    <rect x="25" y="1320" width="150" height="46" rx="8" fill="url(#pClient)"/>
    <text x="100" y="1340" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Client</text>
    <text x="100" y="1356" text-anchor="middle" fill="#dbeafe" font-size="10">Frontend / Profile</text>
  </g>
  <!-- Events -->
  <g filter="url(#cardShadow)">
    <rect x="215" y="1320" width="150" height="46" rx="8" fill="url(#pEvents)"/>
    <text x="290" y="1340" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Events</text>
    <text x="290" y="1356" text-anchor="middle" fill="#ede9fe" font-size="10">ProfileSkillsEvents</text>
  </g>
  <!-- Service -->
  <g filter="url(#cardShadow)">
    <rect x="415" y="1320" width="150" height="46" rx="8" fill="url(#pService)"/>
    <text x="490" y="1340" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Service</text>
    <text x="490" y="1356" text-anchor="middle" fill="#e0f2fe" font-size="10">SkillsAnalysisService</text>
  </g>
  <!-- Sources -->
  <g filter="url(#cardShadow)">
    <rect x="615" y="1320" width="150" height="46" rx="8" fill="url(#pSources)"/>
    <text x="690" y="1340" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Sources</text>
    <text x="690" y="1356" text-anchor="middle" fill="#d1fae5" font-size="10">SkillSourcesService</text>
  </g>
  <!-- Detection -->
  <g filter="url(#cardShadow)">
    <rect x="815" y="1320" width="150" height="46" rx="8" fill="url(#pDetection)"/>
    <text x="890" y="1340" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Detection</text>
    <text x="890" y="1356" text-anchor="middle" fill="#fef3c7" font-size="10">SkillDetectionService</text>
  </g>
  <!-- Validation -->
  <g filter="url(#cardShadow)">
    <rect x="1005" y="1320" width="150" height="46" rx="8" fill="url(#pValidation)"/>
    <text x="1080" y="1340" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Validation</text>
    <text x="1080" y="1356" text-anchor="middle" fill="#fce7f3" font-size="10">SkillValidationService</text>
  </g>
  <!-- Recon -->
  <g filter="url(#cardShadow)">
    <rect x="1195" y="1320" width="150" height="46" rx="8" fill="url(#pRecon)"/>
    <text x="1270" y="1340" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Recon</text>
    <text x="1270" y="1356" text-anchor="middle" fill="#e0e7ff" font-size="10">SkillAnalysisService</text>
  </g>
  <!-- DB -->
  <g filter="url(#cardShadow)">
    <rect x="1365" y="1320" width="145" height="46" rx="8" fill="url(#pDB)"/>
    <text x="1437" y="1340" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">DB</text>
    <text x="1437" y="1356" text-anchor="middle" fill="#ccfbf1" font-size="10">PostgreSQL (Prisma)</text>
  </g>

  <!-- Legend Footer -->
  <g>
    <rect x="30" y="1380" width="1460" height="30" rx="6" fill="#111827"/>
    <circle cx="100" cy="1395" r="4" fill="#38bdf8"/>
    <text x="112" y="1399" fill="#94a3b8" font-size="10">Request Call</text>
    <line x1="220" y1="1395" x2="245" y2="1395" stroke="#34d399" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="255" y="1399" fill="#94a3b8" font-size="10">Response Return</text>
    <circle cx="400" cy="1395" r="4" fill="#fbbf24"/>
    <text x="412" y="1399" fill="#94a3b8" font-size="10">Database / Transaction</text>
    <circle cx="600" cy="1395" r="4" fill="#c084fc"/>
    <text x="612" y="1399" fill="#94a3b8" font-size="10">Event Bus Notification</text>
    <text x="1460" y="1399" text-anchor="end" fill="#64748b" font-size="10">Sequence Diagram · UMSSY Epic #2</text>
  </g>
</svg>