services:
  postgres:
    image: postgres:18-alpine
    container_name: willcataco-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-willcataco}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./.database-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-willcataco}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped